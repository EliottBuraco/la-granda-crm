<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Granda CRM</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Permanent+Marker&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Light by default, always — dark only when the user flips the switch (data-theme="dark" on <html>). No prefers-color-scheme auto-detect. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F7F7F5; --surface-3:#EFEDE8;
  --text:#141414; --text-muted:#6B6B6B; --border:#141414; --border-soft:#E2DFD8;
  --primary:#E8392E; --primary-dark:#C22A20;
  --success:#2E7D4F; --warn:#B8791E;
  --phase-prospection:#3E8E72; --phase-qualification:#D9722E; --phase-negociation:#8B6FB8;
  --phase-actif-bg:#141414; --phase-actif-fg:#FFFFFF;
  --phase-perdu-bg:#EFEDE8; --phase-perdu-fg:#6B6B6B;
  --radius:3px; --shadow:3px 3px 0 var(--text);
  --font-display:'Archivo Black',Impact,sans-serif; --font-logo:'Permanent Marker',cursive; --font-body:'Inter',system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#141414; --surface:#1C1C1C; --surface-2:#232323; --surface-3:#2B2B2B;
  --text:#F2F0EC; --text-muted:#A6A29A; --border:#F2F0EC; --border-soft:#3A3A3A;
  --primary:#FF6B5A; --primary-dark:#E8392E;
  --success:#4FAE75; --warn:#E0A041;
  --phase-prospection:#5BAE91; --phase-qualification:#E68E4E; --phase-negociation:#A98FD1;
  --phase-actif-bg:#F2F0EC; --phase-actif-fg:#141414;
  --phase-perdu-bg:#2B2B2B; --phase-perdu-fg:#9A968E;
  --shadow:3px 3px 0 rgba(0,0,0,.7);
}
*{box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);line-height:1.45;}
h1,h2,h3{font-family:var(--font-display);font-weight:400;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance;}
button,input,select,textarea{font-family:inherit;color:inherit;}
button{cursor:pointer;}
.hidden{display:none!important;}
::-webkit-scrollbar{height:9px;width:9px;}
::-webkit-scrollbar-thumb{background:var(--border-soft);border-radius:0;}

#app{display:flex;flex-direction:column;min-height:100vh;}
.topbar{display:flex;align-items:center;gap:18px;padding:14px 22px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:30;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-logo{height:38px;width:auto;display:block;}
:root[data-theme="dark"] .brand-logo{filter:invert(1);}
.brand-text span{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.1em;display:block;margin-top:2px;}
.topbar .spacer{flex:1;}
.syncbox{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-muted);}
.syncdot{width:7px;height:7px;border-radius:50%;background:var(--success);}
.syncdot.syncing{background:var(--warn);}
.syncdot.err{background:var(--primary);}
.theme-toggle{border:1.5px solid var(--border);background:var(--surface);border-radius:var(--radius);padding:6px 9px;font-size:13px;line-height:1;}
.tabs{display:flex;gap:8px;padding:14px 22px;border-bottom:1px solid var(--border);background:var(--surface);overflow-x:auto;}
.tab{padding:8px 14px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;color:var(--text);border:1.5px solid var(--border);border-radius:var(--radius);white-space:nowrap;background:var(--surface);}
.tab.active{background:var(--text);color:var(--bg);}
.tab:hover:not(.active){background:var(--surface-2);}
main{flex:1;padding:22px;width:100%;}
.view{display:none;max-width:1280px;width:100%;margin:0 auto;}
.view.active{display:block;}
#view-pipeline{max-width:none;}

.card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:var(--radius);border:1.5px solid var(--border);background:var(--surface);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;}
.btn:hover{background:var(--surface-2);}
.btn-primary{background:var(--text);border-color:var(--text);color:var(--bg);}
.btn-primary:hover{background:var(--primary);border-color:var(--primary-dark);color:#fff;}
.btn-ghost{background:transparent;border-color:transparent;}
.btn-danger{color:var(--primary);border-color:var(--primary);}
.btn-sm{padding:6px 10px;font-size:11px;}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--radius);font-size:11px;font-weight:700;border:1.5px solid var(--border);background:var(--surface);}
input[type=text],input[type=email],input[type=number],input[type=date],input[type=url],input[type=search],input[type=tel],select,textarea{
  width:100%;padding:8px 10px;border:1.5px solid var(--border-soft);border-radius:var(--radius);background:var(--surface);color:var(--text);font-size:13.5px;
}
textarea{resize:vertical;min-height:60px;}
label{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px;}
.field{margin-bottom:13px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.muted{color:var(--text-muted);}
a{color:var(--primary);}
.checkbox-row{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;}
.checkbox-row input{width:auto;}

.peppers{display:inline-flex;gap:2px;vertical-align:middle;}
.peppers svg{width:12px;height:12px;}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px;}
.toolbar select, .toolbar input[type=search]{width:auto;min-width:120px;}
.toolbar .spacer{flex:1;}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px;}
.kpi{padding:16px 18px;}
.kpi.hero{background:var(--primary);border-color:var(--text);color:#141414;}
.kpi .num{font-family:var(--font-display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums;}
.kpi .lbl{font-size:11px;color:var(--text-muted);margin-top:5px;text-transform:uppercase;letter-spacing:.03em;font-weight:700;}
.kpi.hero .lbl{color:#141414;opacity:.75;}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:900px){.dash-grid{grid-template-columns:1fr;} .field-row{grid-template-columns:1fr;}}
.panel{padding:18px;margin-bottom:16px;}
.panel h3{font-size:14px;margin:0 0 14px;}
.action-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:13px;cursor:pointer;}
.action-item:last-child{border-bottom:none;}
.action-item:hover{color:var(--primary);}
.flag{width:8px;height:8px;flex:none;border-radius:50%;}

.goal-card{padding:16px 18px;margin-bottom:12px;}
.goal-card .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px;}
.goal-card .title{font-weight:700;font-size:14px;}
.goal-card .nums{font-size:13px;color:var(--text-muted);font-variant-numeric:tabular-nums;}
.goal-track{height:8px;background:var(--surface-3);border:1px solid var(--border-soft);border-radius:var(--radius);overflow:hidden;margin:8px 0 6px;}
.goal-fill{height:100%;background:var(--success);}
.goal-meta{font-size:11.5px;color:var(--text-muted);display:flex;justify-content:space-between;}

.kanban{display:flex;gap:16px;overflow-x:auto;padding-bottom:10px;}
.kanban-col{flex:1 1 240px;min-width:240px;display:flex;flex-direction:column;}
.kanban-col-head{padding:11px 14px;border:1.5px solid var(--border);background:var(--surface);display:flex;justify-content:space-between;align-items:center;gap:8px;}
.kanban-col-head .t{font-weight:800;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:center;gap:8px;}
.kanban-col-head .n{font-size:11px;color:var(--text-muted);font-weight:700;}
.stage-dot{width:9px;height:9px;border-radius:50%;flex:none;}
.kanban-col-body{flex:1;background:var(--surface-2);border:1.5px solid var(--border);border-top:none;padding:10px;min-height:120px;display:flex;flex-direction:column;gap:10px;}
.kcard{background:var(--surface);border:1.5px solid var(--border-soft);border-radius:var(--radius);padding:14px 16px;cursor:pointer;}
.kcard:hover{border-color:var(--border);}
.kcard .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;}
.kcard .nom{font-weight:700;font-size:14.5px;}
.kcard .meta{font-size:12px;color:var(--text-muted);display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.avatar-chip{width:20px;height:20px;border-radius:50%;background:var(--surface-3);color:var(--text);border:1px solid var(--border-soft);font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);padding:9px 10px;border-bottom:1.5px solid var(--border);white-space:nowrap;font-weight:700;}
td{padding:9px 10px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
tr.leadrow{cursor:pointer;}
tr.leadrow:hover{background:var(--surface-2);}
.table-wrap{overflow-x:auto;border:1.5px solid var(--border);background:var(--surface);}
.table-wrap table{min-width:760px;}
.stage-chip{display:inline-block;padding:3px 8px;border-radius:var(--radius);font-size:10px;font-weight:800;text-transform:uppercase;border:1px solid var(--border);}

.overlay{position:fixed;inset:0;background:rgba(10,10,10,.5);z-index:90;display:flex;justify-content:flex-end;}
.overlay.center{justify-content:center;align-items:center;}
.drawer{width:min(440px,92vw);background:var(--surface);height:100%;overflow-y:auto;padding:22px;border-left:1.5px solid var(--border);}
.modal{width:min(400px,92vw);background:var(--surface);border-radius:var(--radius);border:1.5px solid var(--border);padding:22px;box-shadow:var(--shadow);}
.drawer-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:10px;}
.drawer-head h2{font-size:18px;margin:0;text-transform:none;font-family:var(--font-body);font-weight:800;}
.close-x{background:none;border:none;font-size:20px;color:var(--text-muted);line-height:1;padding:4px;}
.section-title{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin:18px 0 10px;border-top:1px solid var(--border-soft);padding-top:14px;}
.section-title:first-of-type{border-top:none;margin-top:0;padding-top:0;}
.drawer-footer{display:flex;justify-content:space-between;margin-top:20px;padding-top:16px;border-top:1px solid var(--border-soft);}
.check-row{display:flex;gap:14px;flex-wrap:wrap;}
.check-row label{display:flex;align-items:center;gap:5px;font-size:12.5px;text-transform:none;font-weight:600;color:var(--text);}
.check-row input{width:auto;}
details.more{margin-top:4px;}
details.more summary{cursor:pointer;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);padding:8px 0;list-style:none;}
details.more summary::-webkit-details-marker{display:none;}
details.more summary:before{content:'+ ';}
details.more[open] summary:before{content:'– ';}
details.more[open] summary{color:var(--text);}

.linked-contact{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:13px;}
.linked-contact:last-child{border-bottom:none;}

.tournee-city{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin:18px 0 8px;}
.tournee-city:first-child{margin-top:0;}
.tournee-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1.5px solid var(--border-soft);border-radius:var(--radius);background:var(--surface);margin-bottom:8px;cursor:pointer;}
.tournee-row:hover{border-color:var(--border);}
.tournee-row input[type=checkbox]{width:auto;flex:none;}
.tournee-row .nom{font-weight:700;font-size:13.5px;flex:1;}
.tournee-row .sub{font-size:11.5px;color:var(--text-muted);}
.tournee-bar{position:sticky;bottom:0;display:none;align-items:center;gap:14px;background:var(--text);color:var(--bg);padding:14px 18px;border-radius:var(--radius);margin-top:16px;font-weight:700;font-size:13px;}
.tournee-bar.show{display:flex;}
.tournee-bar .spacer{flex:1;}
.tournee-bar .btn{background:var(--bg);color:var(--text);border-color:var(--bg);}
.tournee-bar .btn-ghost-inv{background:transparent;color:var(--bg);border-color:var(--bg);}
.empty{padding:36px 20px;text-align:center;color:var(--text-muted);}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 18px;border-radius:var(--radius);font-size:13px;z-index:200;font-weight:600;border:1.5px solid var(--text);}

.setup-screen{max-width:520px;margin:60px auto;padding:28px;}
.setup-screen h2{font-size:19px;margin:0 0 10px;text-transform:none;font-family:var(--font-body);font-weight:800;}
.setup-screen p{font-size:13.5px;color:var(--text-muted);margin-bottom:14px;line-height:1.6;}
</style>
</head>
<body>

<div id="app">
  <div class="topbar">
    <div class="brand">
      <img class="brand-logo" src="assets/logo-la-granda.png" alt="La Granda">
      <div class="brand-text"><span>CRM</span></div>
    </div>
    <div class="spacer"></div>
    <div class="syncbox" id="syncBox"><span class="syncdot" id="syncDot"></span><span id="syncLabel">—</span></div>
    <button class="theme-toggle" id="themeToggle" title="Changer de thème">☀︎</button>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-view="dashboard">Dashboard</button>
    <button class="tab" data-view="objectifs">Objectifs</button>
    <button class="tab" data-view="pipeline">Pipeline</button>
    <button class="tab" data-view="tournee">Tournée</button>
    <button class="tab" data-view="entreprises">Entreprises</button>
    <button class="tab" data-view="contacts">Contacts</button>
    <button class="tab" data-view="b2c">Clients B2C</button>
  </div>

  <main>
    <div id="setupScreen" class="hidden"></div>

    <section class="view active" id="view-dashboard">
      <div class="kpi-grid" id="kpiGrid"></div>
      <div class="dash-grid">
        <div class="card panel">
          <h3>Objectifs du moment</h3>
          <div id="dashGoals"></div>
        </div>
        <div class="card panel">
          <h3>Actions à relancer</h3>
          <div id="actionsList"></div>
        </div>
      </div>
    </section>

    <section class="view" id="view-objectifs">
      <div class="toolbar">
        <div class="spacer"></div>
        <button class="btn btn-primary" id="addGoalBtn">+ Nouvel objectif</button>
      </div>
      <div id="goalsList"></div>
    </section>

    <section class="view" id="view-pipeline">
      <div class="toolbar" id="pipelineToolbar"></div>
      <div class="kanban" id="kanban"></div>
    </section>

    <section class="view" id="view-tournee">
      <div class="toolbar" id="tourneeToolbar"></div>
      <div id="tourneeList"></div>
      <div class="tournee-bar" id="tourneeBar"></div>
    </section>

    <section class="view" id="view-entreprises">
      <div class="toolbar" id="entreprisesToolbar"></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Entreprise</th><th>Persona</th><th>Étape</th><th>Priorité</th><th>Owner</th><th>Prochaine action</th><th>Valeur</th></tr></thead>
          <tbody id="entreprisesTbody"></tbody>
        </table>
      </div>
    </section>

    <section class="view" id="view-contacts">
      <div class="toolbar" id="contactsToolbar">
        <input type="search" id="contactsSearch" placeholder="Rechercher un contact…">
        <div class="spacer"></div>
        <button class="btn btn-primary" id="addContactBtn">+ Nouveau contact</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nom</th><th>Entreprise</th><th>Rôle</th><th>Email</th><th>Téléphone</th></tr></thead>
          <tbody id="contactsTbody"></tbody>
        </table>
      </div>
    </section>

    <section class="view" id="view-b2c">
      <div class="toolbar" id="b2cToolbar">
        <input type="search" id="b2cSearch" placeholder="Rechercher un client…">
        <div class="spacer"></div>
        <button class="btn btn-primary" id="addB2cBtn">+ Nouveau client</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nom</th><th>Canal</th><th>Ville</th><th>Dernière commande</th><th>Nb commandes</th><th>Valeur totale</th></tr></thead>
          <tbody id="b2cTbody"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script src="data.js"></script>
<script>
(function(){
"use strict";
const D = window.STATIC_DATA;
const STAGE_ORDER = D.stageOrder;
const KO = "Perdu";

// Apps Script Web App URL — rempli une fois le script déployé. Si vide,
// chaque appareil peut le renseigner une fois via l'écran de configuration
// (stocké uniquement dans ce navigateur).
const DEFAULT_API_URL = "https://script.google.com/macros/s/AKfycbyhffsu0e5Q432c_XwQJBV5iZfs8aVbxh4vF9zhHPTF-kAv1QB0ZaBA1X8xv7YsJFsjZw/exec";

const STAGE_COLOR = {
  'Prospection':   { bg:'var(--phase-prospection)',  fg:'#fff' },
  'Qualification': { bg:'var(--phase-qualification)',fg:'#fff' },
  'Négociation':   { bg:'var(--phase-negociation)',  fg:'#fff' },
  'Client actif':  { bg:'var(--phase-actif-bg)',     fg:'var(--phase-actif-fg)' },
  'Perdu':         { bg:'var(--phase-perdu-bg)',     fg:'var(--phase-perdu-fg)' },
};
function stageColor(stage){ return STAGE_COLOR[stage] || STAGE_COLOR['Prospection']; }

/* ---------------- theme (manual light/dark switch, light by default) ---------------- */
function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem('granda_theme'); }catch(e){}
  if(saved === 'dark'){ document.documentElement.setAttribute('data-theme','dark'); }
  updateThemeButton();
}
function updateThemeButton(){
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const btn = document.getElementById('themeToggle');
  if(btn) btn.textContent = isDark ? '☾' : '☀︎';
}
document.getElementById('themeToggle').addEventListener('click', ()=>{
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if(isDark){ document.documentElement.removeAttribute('data-theme'); try{ localStorage.setItem('granda_theme','light'); }catch(e){} }
  else{ document.documentElement.setAttribute('data-theme','dark'); try{ localStorage.setItem('granda_theme','dark'); }catch(e){} }
  updateThemeButton();
});
initTheme();

function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function fmtMoney(n){ n = Number(n)||0; return n.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'; }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function parseISODate(s){
  if(!s || !/^\d{4}-\d{2}-\d{2}$/.test(String(s).trim())) return null;
  const d = new Date(s+"T00:00:00");
  return isNaN(d.getTime()) ? null : d;
}
function fmtDateDisplay(s){
  const d = parseISODate(s);
  if(!d) return s || "—";
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});
}
function ownersList(s){ return String(s||'').split(',').map(x=>x.trim()).filter(Boolean); }
function toast(msg){
  const t = el('div','toast',msg);
  document.getElementById('toastRoot').appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}
function initials(name){
  return (name||'?').split(/[\s,]+/).filter(Boolean).slice(0,1).map(w=>w[0]).join('').toUpperCase();
}
const PEPPER_PATH = "M11.2 2.3c-.4.9-1.1 1.4-1.9 2-1.8 1.4-3.4 3.4-3.1 6.5.3 3 2.4 5.5 5 6.4 2.6.9 5.3-.1 6.6-2.4 1.1-2 1-4.2-.2-6.6-.9-1.8-2.4-2.8-3.6-3.9-.7-.6-1.3-1.2-1.4-2h-1.4z";
function pepperSvg(active){
  return '<svg viewBox="0 0 20 20"><path d="'+PEPPER_PATH+'" fill="'+(active?'var(--primary)':'none')+'" stroke="'+(active?'var(--primary-dark)':'var(--border)')+'" stroke-width="1.2"/></svg>';
}
function pepperRating(priorite){
  const n = priorite==='High' ? 3 : priorite==='Medium' ? 2 : priorite==='Low' ? 1 : 0;
  const span = document.createElement('span'); span.className='peppers'; span.title = priorite||'Non défini';
  let html='';
  for(let i=0;i<3;i++) html += pepperSvg(i<n);
  span.innerHTML = html;
  return span;
}

/* ---------------- API layer (Google Apps Script) ---------------- */
function getApiUrl(){
  try{ return DEFAULT_API_URL || localStorage.getItem('granda_api_url') || ''; }
  catch(e){ return DEFAULT_API_URL; }
}
function setSync(status, label){
  const dot = document.getElementById('syncDot');
  dot.className = 'syncdot' + (status==='syncing' ? ' syncing' : status==='error' ? ' err' : '');
  document.getElementById('syncLabel').textContent = label;
}
async function apiCall(method, params, body){
  const url = getApiUrl();
  if(!url) throw new Error('no_api_url');
  const q = Object.keys(params||{}).map(k=>encodeURIComponent(k)+'='+encodeURIComponent(params[k])).join('&');
  const full = url + (q ? ('?'+q) : '');
  const opts = { method: method };
  if(body){ opts.headers = {'Content-Type':'text/plain;charset=utf-8'}; opts.body = JSON.stringify(body); }
  const res = await fetch(full, opts);
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'api_error');
  return json.data;
}
function apiList(collection){ return apiCall('GET', {action:'list', collection: collection}); }
function apiCreate(collection, data){ return apiCall('POST', {}, {action:'create', collection: collection, data: data}); }
function apiUpdate(collection, id, data){ return apiCall('POST', {}, {action:'update', collection: collection, id: id, data: data}); }
function apiDelete(collection, id){ return apiCall('POST', {}, {action:'delete', collection: collection, id: id}); }

async function refreshAll(){
  setSync('syncing', 'Synchronisation…');
  try{
    const [companies, contacts, customers, goals] = await Promise.all([
      apiList('Entreprises'), apiList('Contacts'), apiList('Clients_B2C'), apiList('Objectifs'),

function getFilteredCompanies(){
  const f = state.companyFilters;
  return state.companies.filter(l=>{
    if(f.persona && l.persona!==f.persona) return false;
    if(f.priorite && l.priorite!==f.priorite) return false;
    if(f.objectif && l.objectif!==f.objectif) return false;
    if(f.owner && !ownersList(l.owners).includes(f.owner)) return false;
    if(f.search){
      const s = f.search.toLowerCase();
      const hay = [l.nom,l.instagram,l.localisation,l.ville_pays,l.detail].join(' ').toLowerCase();
      if(!hay.includes(s)) return false;
    }
    return true;
  });
}

function goalCard(g, compact){
  const card = el('div', compact ? '' : 'card goal-card');
  if(compact) card.style.marginBottom='14px';

  head.appendChild(el('span','title', g.titre || '(sans titre)'));

  card.appendChild(head);
  const track = el('div','goal-track');
  const pct = g.cible ? Math.min(100, Math.round((Number(g.valeur_actuelle)||0)/Number(g.cible)*100)) : 0;
  const fill = el('div','goal-fill'); fill.style.width = pct+'%';
  if(pct>=100) fill.style.background='var(--success)';
  else if(pct<34) fill.style.background='var(--primary)';
  else fill.style.background='var(--warn)';
  track.appendChild(fill); card.appendChild(track);
  const meta = el('div','goal-meta');
  meta.appendChild(el('span',null, g.echeance ? ('Échéance : '+fmtDateDisplay(g.echeance)) : ''));
  meta.appendChild(el('span',null, pct+'%'));
  card.appendChild(meta);
  if(!compact){

    card.addEventListener('click', ()=>openGoalModal(g));
  }
  return card;
}

    f.appendChild(input); drawer.appendChild(f); fields[key]=input; return input;
  }
  function select(key, labelText, options){
    const f = el('div','field'); f.appendChild(el('label',null,labelText));
    const s = document.createElement('select');
    const blank = el('option',null,'—'); blank.value=''; s.appendChild(blank);
    options.forEach(o=>{ const op=el('option',null,o); op.value=o; if(lead[key]===o) op.selected=true; s.appendChild(op); });
    f.appendChild(s); drawer.appendChild(f); fields[key]=s; return s;
  }

  field('nom','Nom');
  const fRow1 = el('div','field-row');
  select('persona','Persona', D.personas); const personaField = drawer.lastChild; fRow1.appendChild(personaField);
  select('stage','Étape', STAGE_ORDER); const stageField = drawer.lastChild; fRow1.appendChild(stageField);
  drawer.appendChild(fRow1);
  const fRow2 = el('div','field-row');
  select('priorite','Priorité', D.priorites); const prioField = drawer.lastChild; fRow2.appendChild(prioField);
  const fNext = document.createElement('div'); fNext.appendChild(el('label',null,'Prochaine action')); const iNext=document.createElement('input'); iNext.type='date'; iNext.value=parseISODate(lead.date_prochaine_action)?lead.date_prochaine_action:''; fNext.appendChild(iNext);
  fRow2.appendChild(fNext); drawer.appendChild(fRow2);
  fields.date_prochaine_action=iNext;
  const ownerWrap = el('div','check-row');
  const currentOwners = ownersList(lead.owners);
  D.owners.forEach(o=>{ const lbl=document.createElement('label'); const cb=document.createElement('input'); cb.type='checkbox'; cb.value=o; cb.checked=currentOwners.includes(o); lbl.appendChild(cb); lbl.appendChild(document.createTextNode(o)); ownerWrap.appendChild(lbl); });
  const fOwner = el('div','field'); fOwner.appendChild(el('label',null,'Owner(s)')); fOwner.appendChild(ownerWrap); drawer.appendChild(fOwner);
  field('valeur','Valeur (€)','number');
  field('detail','Notes','textarea');

  const details = document.createElement('details'); details.className='more';
  const summary = document.createElement('summary'); summary.textContent='Plus de détails'; details.appendChild(summary);
  drawer.appendChild(details);
  function fieldIn(container, key, labelText, type){
    const f = el('div','field'); f.appendChild(el('label',null,labelText));
    const input = type==='textarea' ? document.createElement('textarea') : document.createElement('input');
    if(type && type!=='textarea') input.type = type;
    input.value = lead[key] || '';
    f.appendChild(input); container.appendChild(f); fields[key]=input; return input;
  }
  fieldIn(details, 'instagram', 'Instagram (@handle)');
  fieldIn(details, 'site_web', 'Site web', 'url');
  fieldIn(details, 'ville_pays', 'Ville / Pays');
  select('objectif','Objectif', D.objectifs); details.appendChild(drawer.lastChild);
  const dOld = document.createElement('div'); dOld.appendChild(el('label',null,'Dernier contact')); const iOld=document.createElement('input'); iOld.type='date'; iOld.value=parseISODate(lead.dernier_contact)?lead.dernier_contact:''; dOld.className='field'; dOld.appendChild(iOld);
  details.appendChild(dOld); fields.dernier_contact=iOld;
  fieldIn(details, 'commandes', 'Commandes passées');

  section('Contacts liés');
  const contactsBox = el('div');
  const linked = state.contacts.filter(c=>c.entreprise_id===id);
  if(linked.length===0) contactsBox.appendChild(el('div','muted','Aucun contact lié.'));
  linked.forEach(c=>{
    const row = el('div','linked-contact');
    row.appendChild(el('span',null, [c.nom, c.role].filter(Boolean).join(' · ') || '(sans nom)'));
    const openBtn = el('button','btn btn-sm','Ouvrir');
    openBtn.addEventListener('click', ()=>openContactModal(c));
    row.appendChild(openBtn);
    contactsBox.appendChild(row);
  });
  drawer.appendChild(contactsBox);
  const addContactBtn = el('button','btn btn-sm','+ Ajouter un contact'); addContactBtn.style.marginTop='8px';
  addContactBtn.addEventListener('click', ()=>openContactModal(null, id));
  drawer.appendChild(addContactBtn);

  const footer = el('div','drawer-footer');
  const del = el('button','btn btn-danger','Supprimer');
  del.addEventListener('click', async ()=>{
    if(confirm('Supprimer définitivement cette entreprise ?')){ await deleteDoc('Entreprises', id); closeModal(); toast('Entreprise supprimée'); }
  });
  const save = el('button','btn btn-primary','Enregistrer');
  save.addEventListener('click', async ()=>{
    const patch = {};
    Object.keys(fields).forEach(k=>{ let v = fields[k].value; if(k==='valeur') v = Number(v)||0; patch[k]=v; });
    patch.owners = Array.from(ownerWrap.querySelectorAll('input:checked')).map(c=>c.value).join(', ');
    try{ await updateDoc('Entreprises', id, patch); toast('Entreprise mise à jour'); closeModal(); }
    catch(e){ /* toast already shown */ }
  });
  footer.appendChild(del); footer.appendChild(save);
  drawer.appendChild(footer);
  overlay.appendChild(drawer);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
  root.appendChild(overlay);
}

/* ---------------- CONTACTS ---------------- */
function companyName(id){ const c = state.companies.find(x=>x.id===id); return c ? c.nom : ''; }
function renderContacts(){
  document.getElementById('contactsSearch').value = state.contactsSearch;
  const tbody = document.getElementById('contactsTbody'); tbody.innerHTML='';
  const s = state.contactsSearch.toLowerCase();
  const list = state.contacts.filter(c=> !s || [c.nom,c.role,c.email,companyName(c.entreprise_id)].join(' ').toLowerCase().includes(s))
    .sort((a,b)=>(a.nom||'').localeCompare(b.nom||''));
  if(list.length===0){ const tr=document.createElement('tr'); const td=document.createElement('td'); td.colSpan=5; td.className='empty'; td.textContent='Aucun contact.'; tr.appendChild(td); tbody.appendChild(tr); return; }
  list.forEach(c=>{
    const tr = el('tr','leadrow'); tr.addEventListener('click', ()=>openContactModal(c));
    tr.appendChild(el('td',null, c.nom || '(sans nom)'));
    tr.appendChild(el('td',null, companyName(c.entreprise_id) || '—'));
    tr.appendChild(el('td',null, c.role || ''));
    tr.appendChild(el('td',null, c.email || ''));
    tr.appendChild(el('td',null, c.telephone || ''));
    tbody.appendChild(tr);
  });
}
document.getElementById('contactsSearch').addEventListener('input', e=>{ state.contactsSearch=e.target.value; renderContacts(); });
document.getElementById('addContactBtn').addEventListener('click', ()=>openContactModal(null));
function openContactModal(contact, presetCompanyId){
  const root = document.getElementById('modalRoot'); root.innerHTML='';
  const overlay = el('div','overlay center');
  const modal = el('div','modal');
  modal.appendChild(el('h2',null, contact ? 'Modifier le contact' : 'Nouveau contact'));
  const fields = {};
  function field(key, labelText, type, val){
    const f = el('div','field'); f.appendChild(el('label',null,labelText));
    const input = type==='textarea' ? document.createElement('textarea') : document.createElement('input');
    if(type && type!=='textarea') input.type = type;
    input.value = val || ''; f.appendChild(input); modal.appendChild(f); fields[key]=input; return input;
  }
  field('nom','Nom', 'text', contact && contact.nom);
  const compSel = document.createElement('select');
  const blank = el('option',null,'— Aucune entreprise —'); blank.value=''; compSel.appendChild(blank);
  state.companies.slice().sort((a,b)=>(a.nom||'').localeCompare(b.nom||'')).forEach(c=>{
    const o = el('option',null,c.nom||'(sans nom)'); o.value=c.id;
    if((contact && contact.entreprise_id===c.id) || (!contact && presetCompanyId===c.id)) o.selected=true;
    compSel.appendChild(o);
  });
  const fComp = el('div','field'); fComp.appendChild(el('label',null,'Entreprise liée')); fComp.appendChild(compSel); modal.appendChild(fComp);
  field('role','Rôle / fonction', 'text', contact && contact.role);
  field('email','Email', 'email', contact && contact.email);
  field('telephone','Téléphone', 'tel', contact && contact.telephone);
  field('notes','Notes', 'textarea', contact && contact.notes);
  const actions = el('div','drawer-footer');
  if(contact){
    const del = el('button','btn btn-danger','Supprimer');
    del.addEventListener('click', async ()=>{ await deleteDoc('Contacts', contact.id); closeModal(); toast('Contact supprimé'); });
    actions.appendChild(del);
  } else actions.appendChild(el('div'));
  const save = el('button','btn btn-primary', contact ? 'Enregistrer' : 'Créer');
  save.addEventListener('click', async ()=>{
    const data = { nom: fields.nom.value.trim(), entreprise_id: compSel.value || '', role: fields.role.value, email: fields.email.value, telephone: fields.telephone.value, notes: fields.notes.value };
    if(!data.nom){ toast('Le nom est requis'); return; }
    if(contact) await updateDoc('Contacts', contact.id, data); else await createDoc('Contacts', data);
    closeModal(); toast(contact ? 'Contact mis à jour' : 'Contact créé');
  });
  actions.appendChild(save);
  modal.appendChild(actions);
  overlay.appendChild(modal);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
  root.appendChild(overlay);
}

/* ---------------- B2C ---------------- */
function renderB2C(){
  document.getElementById('b2cSearch').value = state.b2cSearch;
  const tbody = document.getElementById('b2cTbody'); tbody.innerHTML='';
  const s = state.b2cSearch.toLowerCase();
  const list = state.customers.filter(c=> !s || [c.nom,c.email,c.ville].join(' ').toLowerCase().includes(s))
    .sort((a,b)=>(a.nom||'').localeCompare(b.nom||''));
  if(list.length===0){ const tr=document.createElement('tr'); const td=document.createElement('td'); td.colSpan=6; td.className='empty'; td.textContent='Aucun client B2C pour le moment.'; tr.appendChild(td); tbody.appendChild(tr); return; }
  list.forEach(c=>{
    const tr = el('tr','leadrow'); tr.addEventListener('click', ()=>openB2CModal(c));
    tr.appendChild(el('td',null, c.nom || '(sans nom)'));
    tr.appendChild(el('td',null, c.canal || ''));
    tr.appendChild(el('td',null, c.ville || ''));
    tr.appendChild(el('td',null, c.date_derniere_commande ? fmtDateDisplay(c.date_derniere_commande) : '—'));
    tr.appendChild(el('td',null, c.nb_commandes || 0));
    tr.appendChild(el('td',null, fmtMoney(c.valeur_totale||0)));
    tbody.appendChild(tr);
  });
}
document.getElementById('b2cSearch').addEventListener('input', e=>{ state.b2cSearch=e.target.value; renderB2C(); });
document.getElementById('addB2cBtn').addEventListener('click', ()=>openB2CModal(null));
function openB2CModal(customer){
  const root = document.getElementById('modalRoot'); root.innerHTML='';
  const overlay = el('div','overlay');
  const drawer = el('div','drawer');
  const head = el('div','drawer-head');
  head.appendChild(el('h2',null, customer ? (customer.nom||'(sans nom)') : 'Nouveau client'));
  const closeBtn = el('button','close-x','✕'); closeBtn.addEventListener('click', closeModal);
  head.appendChild(closeBtn); drawer.appendChild(head);
  const fields = {};
  function field(key, labelText, type){
    const f = el('div','field'); f.appendChild(el('label',null,labelText));
    const input = type==='textarea' ? document.createElement('textarea') : document.createElement('input');
    if(type && type!=='textarea') input.type = type;
    input.value = customer ? (customer[key] || '') : '';
    f.appendChild(input); drawer.appendChild(f); fields[key]=input; return input;
  }
  field('nom','Nom');
  field('email','Email','email');
  field('telephone','Téléphone','tel');
  field('ville','Ville');
  const f = el('div','field'); f.appendChild(el('label',null,'Canal d’acquisition'));
  const sel = document.createElement('select');
  D.canauxB2C.forEach(c=>{ const o=el('option',null,c); o.value=c; if(customer && customer.canal===c) o.selected=true; sel.appendChild(o); });
  f.appendChild(sel); drawer.appendChild(f); fields.canal=sel;
  const dateRow = el('div','field-row');
  const d1 = document.createElement('div'); d1.appendChild(el('label',null,'1ère commande')); const i1=document.createElement('input'); i1.type='date'; i1.value = customer && parseISODate(customer.date_premiere_commande) ? customer.date_premiere_commande : ''; d1.appendChild(i1);
  const d2 = document.createElement('div'); d2.appendChild(el('label',null,'Dernière commande')); const i2=document.createElement('input'); i2.type='date'; i2.value = customer && parseISODate(customer.date_derniere_commande) ? customer.date_derniere_commande : ''; d2.appendChild(i2);
  dateRow.appendChild(d1); dateRow.appendChild(d2); drawer.appendChild(dateRow);
  fields.date_premiere_commande=i1; fields.date_derniere_commande=i2;
  const numRow = el('div','field-row');
  const n1 = document.createElement('div'); n1.appendChild(el('label',null,'Nb commandes')); const ni1=document.createElement('input'); ni1.type='number'; ni1.value = customer ? (customer.nb_commandes||0) : 0; n1.appendChild(ni1);
  const n2 = document.createElement('div'); n2.appendChild(el('label',null,'Valeur totale (€)')); const ni2=document.createElement('input'); ni2.type='number'; ni2.value = customer ? (customer.valeur_totale||0) : 0; n2.appendChild(ni2);
  numRow.appendChild(n1); numRow.appendChild(n2); drawer.appendChild(numRow);
  fields.nb_commandes=ni1; fields.valeur_totale=ni2;
  const cb = el('label','checkbox-row'); const cbi=document.createElement('input'); cbi.type='checkbox'; cbi.checked = customer ? (customer.newsletter===true || customer.newsletter==='TRUE' || customer.newsletter==='true') : false;
  cb.appendChild(cbi); cb.appendChild(document.createTextNode('Inscrit à la newsletter')); drawer.appendChild(cb); fields.newsletter=cbi;
  field('notes','Notes','textarea');
  const footer = el('div','drawer-footer');
  if(customer){
    const del = el('button','btn btn-danger','Supprimer');
    del.addEventListener('click', async ()=>{ if(confirm('Supprimer ce client ?')){ await deleteDoc('Clients_B2C', customer.id); closeModal(); toast('Client supprimé'); } });
    footer.appendChild(del);
  } else footer.appendChild(el('div'));
  const save = el('button','btn btn-primary', customer ? 'Enregistrer' : 'Créer');
  save.addEventListener('click', async ()=>{
    const data = {
      nom: fields.nom.value.trim(), email: fields.email.value, telephone: fields.telephone.value, ville: fields.ville.value,
      canal: fields.canal.value, date_premiere_commande: fields.date_premiere_commande.value, date_derniere_commande: fields.date_derniere_commande.value,
      nb_commandes: Number(fields.nb_commandes.value)||0, valeur_totale: Number(fields.valeur_totale.value)||0,
      newsletter: fields.newsletter.checked, notes: fields.notes.value,
    };
    if(!data.nom){ toast('Le nom est requis'); return; }
    if(customer) await updateDoc('Clients_B2C', customer.id, data); else await createDoc('Clients_B2C', data);
    closeModal(); toast(customer ? 'Client mis à jour' : 'Client créé');
  });
  footer.appendChild(save);
  drawer.appendChild(footer);
  overlay.appendChild(drawer);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
  root.appendChild(overlay);
}

/* ---------------- boot ---------------- */
boot();
})();
</script>
