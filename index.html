<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Granda CRM</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Permanent+Marker&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* Light by default, always — dark only when the user flips the switch (data-theme="dark" on <html>). No prefers-color-scheme auto-detect. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F7F7F5; --surface-3:#EFEDE8;
  --text:#141414; --text-muted:#6B6B6B; --border:#141414; --border-soft:#E7E4DD; --border-strong:#141414;
  --primary:#FF3B2E; --primary-dark:#C22A20; --primary-tint:#FFE7E3;
  --success:#1FAE63; --warn:#FFB400;
  --phase-prospection:#1FAE63; --phase-contacte:#2E8FD9; --phase-qualification:#FF8A1E; --phase-interesse:#E8B400; --phase-negociation:#9B5DE5; --phase-premiere:#E0469A;
  --phase-actif-bg:#141414; --phase-actif-fg:#FFFFFF;
  --phase-perdu-bg:#EFEDE8; --phase-perdu-fg:#6B6B6B;
  --map-prospect:#1FAE63; --map-relancer:#FF8A1E; --map-actif:#141414; --map-inactif:#9A968E; --map-distributeur:#2E8FD9;
  --radius:6px; --radius-sm:4px; --radius-pill:6px;
  --shadow:5px 5px 0 #141414; --shadow-sm:3px 3px 0 #141414;
  --font-display:'Archivo Black',Impact,sans-serif; --font-logo:'Permanent Marker',cursive; --font-body:'Inter',system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#141414; --surface:#1C1C1C; --surface-2:#232323; --surface-3:#2B2B2B;
  --text:#F2F0EC; --text-muted:#A6A29A; --border:#F2F0EC; --border-soft:#333131; --border-strong:#F2F0EC;
  --primary:#FF6B5A; --primary-dark:#E8392E; --primary-tint:#3A201C;
  --success:#38C27F; --warn:#FFC94D;
  --phase-prospection:#38C27F; --phase-contacte:#5BA7E8; --phase-qualification:#FFA64D; --phase-interesse:#F2CA4D; --phase-negociation:#B98CF0; --phase-premiere:#ED6EB5;
  --phase-actif-bg:#F2F0EC; --phase-actif-fg:#141414;
  --phase-perdu-bg:#2B2B2B; --phase-perdu-fg:#9A968E;
  --map-prospect:#38C27F; --map-relancer:#FFA64D; --map-actif:#F2F0EC; --map-inactif:#6B6760; --map-distributeur:#5BA7E8;
  --shadow:5px 5px 0 rgba(0,0,0,.55); --shadow-sm:3px 3px 0 rgba(0,0,0,.55);
}
*{box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);line-height:1.45;}
h1,h2,h3{font-family:var(--font-display);font-weight:400;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance;}
button,input,select,textarea{font-family:inherit;color:inherit;}
button{cursor:pointer;}
.hidden{display:none!important;}
::-webkit-scrollbar{height:9px;width:9px;}
::-webkit-scrollbar-thumb{background:var(--border-soft);border-radius:0;}

#app{display:flex;min-height:100vh;}
.sidebar{width:230px;flex:none;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--border-soft);padding:22px 16px;position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;z-index:30;}
.brand{display:flex;align-items:center;gap:10px;padding:0 4px;}
.brand-logo{height:36px;width:auto;display:block;}
:root[data-theme="dark"] .brand-logo{filter:invert(1);}
.brand-text span{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.1em;display:block;margin-top:2px;}
.tabs{display:flex;flex-direction:column;gap:4px;margin-top:28px;}
.tab{display:block;width:100%;text-align:left;padding:12px 14px;font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;color:var(--text);border:none;border-radius:var(--radius);white-space:nowrap;background:transparent;}
.tab.active{background:var(--primary-tint);color:var(--primary-dark);}
.tab:hover:not(.active){background:var(--surface-2);}
.sidebar-spacer{flex:1;}
.sidebar-footer{display:flex;align-items:center;gap:10px;padding-top:16px;margin-top:16px;border-top:1px solid var(--border-soft);}
.syncbox{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-muted);flex:1;min-width:0;}
.syncdot{width:7px;height:7px;border-radius:50%;background:var(--success);flex:none;}
.syncdot.syncing{background:var(--warn);}
.syncdot.err{background:var(--primary);}
.theme-toggle{border:1.5px solid var(--border-strong);background:var(--surface);border-radius:var(--radius-sm);padding:7px 10px;font-size:13px;line-height:1;flex:none;}
main{flex:1;min-width:0;padding:28px 32px;width:100%;}
.view{display:none;max-width:1280px;width:100%;margin:0 auto;}
.view.active{display:block;}
#view-pipeline{max-width:none;}

.card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);}
.btn{display:inline-flex;align-items:center;gap:6px;padding:11px 18px;border-radius:var(--radius);border:1.5px solid var(--border-strong);background:var(--surface);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;box-shadow:var(--shadow-sm);}
.btn:hover{background:var(--surface-2);}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);border-color:var(--primary-dark);color:#fff;}
.btn-ghost{background:transparent;border-color:transparent;}
.btn-danger{color:var(--primary);border-color:var(--primary);}
.btn-sm{padding:8px 12px;font-size:11px;}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--radius);font-size:11px;font-weight:700;border:1.5px solid var(--border);background:var(--surface);}
input[type=text],input[type=email],input[type=number],input[type=date],input[type=url],input[type=search],input[type=tel],select,textarea{
  width:100%;padding:8px 10px;border:1.5px solid var(--border-soft);border-radius:var(--radius);background:var(--surface);color:var(--text);font-size:13.5px;
}
textarea{resize:vertical;min-height:60px;}
label{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px;}
.field{margin-bottom:13px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.muted{color:var(--text-muted);}
a{color:var(--primary);}
.checkbox-row{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;}
.checkbox-row input{width:auto;}

.peppers{display:inline-flex;gap:2px;vertical-align:middle;}
.peppers svg{width:12px;height:12px;}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px;}
.toolbar select, .toolbar input[type=search]{width:auto;min-width:120px;}
.toolbar .spacer{flex:1;}
.search-toggle{display:flex;}
.search-icon-btn{padding:11px 13px;display:inline-flex;align-items:center;justify-content:center;}
input.search-input-big{width:260px;max-width:60vw;padding:11px 16px;font-weight:700;font-size:13px;border:1.5px solid var(--border-strong);border-radius:var(--radius);box-shadow:var(--shadow-sm);background:var(--surface);color:var(--text);}
.filter-wrap{position:relative;}
.filter-count{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;background:var(--primary);color:#fff;border-radius:50%;font-size:10px;font-weight:800;margin-left:6px;}
.filter-panel{position:absolute;top:calc(100% + 8px);right:0;background:var(--surface);border:1.5px solid var(--border);box-shadow:var(--shadow-sm);padding:14px;border-radius:var(--radius);display:flex;flex-direction:column;gap:10px;min-width:220px;z-index:50;}
.filter-panel.hidden{display:none;}
.filter-panel select{width:100%;min-width:0;}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px;}
.kpi{padding:18px 20px;}
.kpi.hero{background:var(--primary);border-color:var(--primary);color:#fff;}
.kpi .num{font-family:var(--font-display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums;}
.kpi .lbl{font-size:11px;color:var(--text-muted);margin-top:6px;text-transform:uppercase;letter-spacing:.03em;font-weight:700;}
.kpi.hero .lbl{color:#fff;opacity:.85;}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:900px){.dash-grid{grid-template-columns:1fr;} .field-row{grid-template-columns:1fr;}}
@media (max-width:760px){
  #app{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:relative;flex-direction:row;align-items:center;padding:12px 16px;overflow-x:auto;}
  .tabs{flex-direction:row;margin-top:0;margin-left:14px;gap:6px;}
  .sidebar-spacer{display:none;}
  .sidebar-footer{border-top:none;margin-top:0;padding-top:0;margin-left:auto;padding-left:14px;}
  main{padding:18px;}
}
.panel{padding:18px;margin-bottom:16px;}
.panel h3{font-size:14px;margin:0 0 14px;}
.action-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:13px;cursor:pointer;}
.action-item:last-child{border-bottom:none;}
.action-item:hover{color:var(--primary);}
.flag{width:8px;height:8px;flex:none;border-radius:50%;}

.goal-card{padding:16px 18px;margin-bottom:12px;}
.goal-card .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px;}
.goal-card .title{font-weight:700;font-size:14px;}
.goal-card .nums{font-size:13px;color:var(--text-muted);font-variant-numeric:tabular-nums;}
.goal-track{height:8px;background:var(--surface-3);border:1px solid var(--border-soft);border-radius:var(--radius);overflow:hidden;margin:8px 0 6px;}
.goal-fill{height:100%;background:var(--success);}
.goal-meta{font-size:11.5px;color:var(--text-muted);display:flex;justify-content:space-between;}

.kanban{display:flex;gap:18px;overflow-x:auto;padding-bottom:10px;}
.kanban-col{flex:1 1 240px;min-width:240px;display:flex;flex-direction:column;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);background:var(--surface-2);}
.kanban-col-head{padding:13px 16px;min-height:62px;background:var(--surface);border-bottom:1px solid var(--border-soft);display:flex;flex-direction:column;justify-content:center;gap:4px;}
.kanban-col-head .t{font-weight:800;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:center;gap:8px;min-width:0;}
.kanban-col-head .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.kanban-col-head .n{font-size:11px;color:var(--text-muted);font-weight:700;}
.stage-dot{width:10px;height:10px;border-radius:50%;flex:none;}
.kanban-col-body{flex:1;padding:12px;min-height:120px;display:flex;flex-direction:column;gap:10px;}
.kcard{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;cursor:grab;box-shadow:var(--shadow-sm);transition:transform .1s ease,box-shadow .1s ease;}
.kcard:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 #141414;}
:root[data-theme="dark"] .kcard:hover{box-shadow:5px 5px 0 rgba(0,0,0,.55);}
.kcard.dragging{opacity:.4;}
.kanban-col-body.drag-over{background:var(--primary-tint);outline:2px dashed var(--primary);outline-offset:-4px;}
.kcard .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;}
.kcard .nom{font-weight:700;font-size:14.5px;}
.kcard .meta{font-size:12px;color:var(--text-muted);display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.avatar-chip{width:20px;height:20px;border-radius:50%;background:var(--surface-3);color:var(--text);border:1px solid var(--border-soft);font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);padding:9px 10px;border-bottom:1.5px solid var(--border);white-space:nowrap;font-weight:700;}
td{padding:9px 10px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
tr.leadrow{cursor:pointer;}
tr.leadrow:hover{background:var(--surface-2);}
.table-wrap{overflow-x:auto;border:1.5px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-sm);}
.view-toggle{display:flex;border:1.5px solid var(--border-strong);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);}
.view-toggle button{padding:10px 16px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;background:var(--surface);border:none;border-right:1.5px solid var(--border-strong);}
.view-toggle button:last-child{border-right:none;}
.view-toggle button.active{background:var(--text);color:var(--bg);}
.map-wrap{border:1.5px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden;background:var(--surface);}
#entreprisesMap{height:560px;width:100%;}
.map-status{padding:9px 14px;font-size:12px;color:var(--text-muted);border-top:1px solid var(--border-soft);}
.map-legend{display:flex;flex-wrap:wrap;gap:14px;padding:10px 14px;border-bottom:1px solid var(--border-soft);font-size:11.5px;}
.map-legend-item{display:flex;align-items:center;gap:6px;}
.map-legend-dot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--border-strong);flex:none;}
.map-popup .nom{font-weight:800;font-size:13px;margin-bottom:2px;}
.map-popup .muted{font-size:11.5px;}
.map-popup .statut-badge{display:inline-block;padding:2px 7px;border-radius:var(--radius-sm);font-size:9.5px;font-weight:800;text-transform:uppercase;color:#fff;margin:4px 0;}
.map-popup .map-meta{font-size:11px;color:var(--text-muted);margin-top:4px;}
.map-popup label{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;text-transform:none;margin-top:8px;}
.map-popup label input{width:auto;}
.map-popup button{margin-top:8px;}
.map-pin{width:22px;height:22px;border-radius:50% 50% 50% 0;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);transform:rotate(-45deg);}
.table-wrap table{min-width:760px;}
.stage-chip{display:inline-block;padding:3px 8px;border-radius:var(--radius);font-size:10px;font-weight:800;text-transform:uppercase;border:1px solid var(--border);}

.overlay{position:fixed;inset:0;background:rgba(10,10,10,.5);z-index:90;display:flex;justify-content:flex-end;}
.overlay.center{justify-content:center;align-items:center;}
.drawer{width:min(440px,92vw);background:var(--surface);height:100%;overflow-y:auto;padding:22px;border-left:1.5px solid var(--border);}
.drawer.expanded{position:fixed;inset:0;width:100%;height:100%;border-left:none;padding:32px clamp(20px,6vw,56px);z-index:95;}
.modal{width:min(400px,92vw);background:var(--surface);border-radius:var(--radius);border:1.5px solid var(--border);padding:22px;box-shadow:var(--shadow);}
.drawer-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:10px;}
.drawer-head h2{font-size:18px;margin:0;text-transform:none;font-family:var(--font-body);font-weight:800;}
.drawer.expanded .drawer-head h2{font-size:26px;}
.drawer-head-actions{display:flex;align-items:center;gap:2px;flex:none;}
.close-x,.expand-btn{background:none;border:none;font-size:18px;color:var(--text-muted);line-height:1;padding:4px 6px;}
.close-x:hover,.expand-btn:hover{color:var(--text);}
.expand-btn{font-size:15px;}
.drawer-tabs{display:none;gap:4px;margin-bottom:24px;border-bottom:1.5px solid var(--border);}
.drawer.expanded .drawer-tabs{display:flex;}
.drawer-tab{padding:10px 20px;font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;color:var(--text-muted);background:transparent;border:none;border-bottom:3px solid transparent;margin-bottom:-1.5px;}
.drawer-tab:hover{color:var(--text);}
.drawer-tab.active{color:var(--text);border-bottom-color:var(--primary);}
.drawer-panel{display:block;}
.drawer.expanded .drawer-panel{display:none;max-width:760px;margin:0 auto;}
.drawer.expanded .drawer-panel.active{display:block;}
.section-title{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin:18px 0 10px;border-top:1px solid var(--border-soft);padding-top:14px;}
.section-title:first-of-type{border-top:none;margin-top:0;padding-top:0;}
.drawer-footer{display:flex;justify-content:space-between;margin-top:20px;padding-top:16px;border-top:1px solid var(--border-soft);}
.check-row{display:flex;gap:14px;flex-wrap:wrap;}
.check-row label{display:flex;align-items:center;gap:5px;font-size:12.5px;text-transform:none;font-weight:600;color:var(--text);}
.check-row input{width:auto;}
details.more{margin-top:4px;}
details.more summary{cursor:pointer;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);padding:8px 0;list-style:none;}
details.more summary::-webkit-details-marker{display:none;}
details.more summary:before{content:'+ ';}
details.more[open] summary:before{content:'– ';}
details.more[open] summary{color:var(--text);}

.linked-contact{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:13px;}
.linked-contact:last-child{border-bottom:none;}

.feed-composer{border-top:1px solid var(--border-soft);padding-top:12px;margin-bottom:16px;}
.feed-composer-bottom{margin-top:14px;margin-bottom:0;}
.feed-composer textarea{margin-bottom:8px;min-height:50px;}
.feed-composer-row{display:flex;gap:8px;align-items:center;}
.feed-composer-row select{width:auto;flex:none;}
.feed-composer-commande{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;border-top:1px solid var(--border-soft);padding-top:12px;margin-bottom:10px;}
.feed-composer-commande .mini-field{display:flex;flex-direction:column;gap:3px;}
.feed-composer-commande .mini-field input{width:auto;}
.feed-composer-commande .mini-field.grow{flex:1;min-width:140px;}
.feed-composer-commande label{margin:0;}
.feed{display:flex;flex-direction:column;gap:10px;margin-bottom:6px;}
.feed-item{border:1px solid var(--border-soft);border-radius:var(--radius);padding:10px 12px;background:var(--surface);}
.feed-item-commande{background:var(--surface-2);}
.feed-item-legacy{opacity:.75;}
.feed-item-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px;}
.feed-auteur{font-weight:800;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;}
.feed-date{font-size:10.5px;color:var(--text-muted);white-space:nowrap;}
.feed-text{font-size:13px;white-space:pre-wrap;}
.feed-source{font-size:10.5px;color:var(--text-muted);margin-top:4px;font-style:italic;}

.tournee-city{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin:18px 0 8px;}
.tournee-city:first-child{margin-top:0;}
.tournee-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1.5px solid var(--border-soft);border-radius:var(--radius);background:var(--surface);margin-bottom:8px;cursor:pointer;}
.tournee-card{padding:14px 16px;margin-bottom:10px;cursor:pointer;}
.tournee-card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px;}
.tournee-card-head .nom{font-weight:800;font-size:14px;}
.tournee-stop{border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow-sm);background:var(--surface);}
.tournee-stop-top{display:flex;align-items:center;gap:10px;}
.tournee-stop-reorder{display:flex;flex-direction:column;gap:2px;flex:none;}
.btn-ghost-sm{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:1px 6px;font-size:11px;line-height:1.4;}
.btn-ghost-sm:disabled{opacity:.3;}
.tournee-stop-info{flex:1;min-width:0;}
.tournee-stop-info .nom{font-weight:700;font-size:13.5px;}
.tournee-stop-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.tournee-row:hover{border-color:var(--border);}
.tournee-row input[type=checkbox]{width:auto;flex:none;}
.tournee-row .nom{font-weight:700;font-size:13.5px;flex:1;}
.tournee-row .sub{font-size:11.5px;color:var(--text-muted);}
.tournee-bar{position:sticky;bottom:0;display:none;align-items:center;gap:14px;background:var(--text);color:var(--bg);padding:14px 18px;border-radius:var(--radius);margin-top:16px;font-weight:700;font-size:13px;}
.tournee-bar.show{display:flex;}
.tournee-bar .spacer{flex:1;}
.tournee-bar .btn{background:var(--bg);color:var(--text);border-color:var(--bg);}
.tournee-bar .btn-ghost-inv{background:transparent;color:var(--bg);border-color:var(--bg);}

<script src="data.js"></script>
<script>
(function(){
"use strict";
const D = window.STATIC_DATA;
const STAGE_ORDER = D.stageOrder;
const KO = "Perdu";

// Apps Script Web App URL — rempli une fois le script déployé. Si vide,
// chaque appareil peut le renseigner une fois via l'écran de configuration
// (stocké uniquement dans ce navigateur).
const DEFAULT_API_URL = "https://script.google.com/macros/s/AKfycbyhffsu0e5Q432c_XwQJBV5iZfs8aVbxh4vF9zhHPTF-kAv1QB0ZaBA1X8xv7YsJFsjZw/exec";

const STAGE_COLOR = {
  'À prospecter':      { bg:'var(--phase-prospection)',  fg:'#fff' },
  'Contacté':          { bg:'var(--phase-contacte)',     fg:'#fff' },
  'Échantillon envoyé':{ bg:'var(--phase-negociation)',  fg:'#fff' },
  'Intéressé':         { bg:'var(--phase-interesse)',    fg:'#141414' },
  'Première commande': { bg:'var(--phase-premiere)',     fg:'#fff' },
  'Client récurrent':   { bg:'var(--phase-actif-bg)',     fg:'var(--phase-actif-fg)' },
  'Perdu':              { bg:'var(--phase-perdu-bg)',     fg:'var(--phase-perdu-fg)' },
};
function stageColor(stage){ return STAGE_COLOR[stage] || STAGE_COLOR['À prospecter']; }

const MAP_STATUS_META = {
  prospect:       { label:'Prospect',       color:'var(--map-prospect)' },
  a_relancer:     { label:'À relancer',     color:'var(--map-relancer)' },
  client_actif:   { label:'Client récurrent', color:'var(--map-actif)' },
  client_inactif: { label:'Client inactif', color:'var(--map-inactif)' },
  distributeur:   { label:'Distributeur',   color:'var(--map-distributeur)' },
};
function computeMapStatus(c){
  const persona = (c.persona||'').toLowerCase();
  if(persona.includes('distributeur') || persona.includes('grossiste')) return 'distributeur';
  if(c.stage==='Client récurrent'){
    const dates = parseLog(c.commandes_log).map(o=>o.date).filter(Boolean).sort();
    const lastDate = dates.length ? dates[dates.length-1] : null;
    if(lastDate){
      const monthsAgo = (Date.now() - new Date(lastDate+'T00:00:00').getTime()) / (1000*60*60*24*30);
      if(monthsAgo > 6) return 'client_inactif';
    }
    return 'client_actif';
  }
  if(c.date_prochaine_action && c.date_prochaine_action < todayISO()) return 'a_relancer';
  return 'prospect';
}

/* ---------------- theme (manual light/dark switch, light by default) ---------------- */
function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem('granda_theme'); }catch(e){}
  if(saved === 'dark'){ document.documentElement.setAttribute('data-theme','dark'); }
  updateThemeButton();
}
function updateThemeButton(){
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const btn = document.getElementById('themeToggle');
  if(btn) btn.textContent = isDark ? '☾' : '☀︎';
}
document.getElementById('themeToggle').addEventListener('click', ()=>{
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if(isDark){ document.documentElement.removeAttribute('data-theme'); try{ localStorage.setItem('granda_theme','light'); }catch(e){} }
  else{ document.documentElement.setAttribute('data-theme','dark'); try{ localStorage.setItem('granda_theme','dark'); }catch(e){} }
  updateThemeButton();
});
initTheme();

function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function fmtMoney(n){ n = Number(n)||0; return n.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'; }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function parseISODate(s){
  if(!s || !/^\d{4}-\d{2}-\d{2}$/.test(String(s).trim())) return null;
  const d = new Date(s+"T00:00:00");
  return isNaN(d.getTime()) ? null : d;
}
function fmtDateDisplay(s){
  const d = parseISODate(s);
  if(!d) return s || "—";
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});
}
function ownersList(s){ return String(s||'').split(',').map(x=>x.trim()).filter(Boolean); }
function parseLog(raw){ try{ const v = JSON.parse(raw||'[]'); return Array.isArray(v) ? v : []; }catch(e){ return []; } }
function fmtDateTimeDisplay(iso){
  const d = new Date(iso);
  if(isNaN(d.getTime())) return iso || '';
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}) + ' · ' + d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}
function debounce(fn, ms){ let t; return function(...args){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,args), ms); }; }
function toast(msg){
  const t = el('div','toast',msg);
  document.getElementById('toastRoot').appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}
function initials(name){
  return (name||'?').split(/[\s,]+/).filter(Boolean).slice(0,1).map(w=>w[0]).join('').toUpperCase();
}
const PEPPER_PATH = "M11.2 2.3c-.4.9-1.1 1.4-1.9 2-1.8 1.4-3.4 3.4-3.1 6.5.3 3 2.4 5.5 5 6.4 2.6.9 5.3-.1 6.6-2.4 1.1-2 1-4.2-.2-6.6-.9-1.8-2.4-2.8-3.6-3.9-.7-.6-1.3-1.2-1.4-2h-1.4z";
function pepperSvg(active){
  return '<svg viewBox="0 0 20 20"><path d="'+PEPPER_PATH+'" fill="'+(active?'var(--primary)':'none')+'" stroke="'+(active?'var(--primary-dark)':'var(--border)')+'" stroke-width="1.2"/></svg>';
}
function pepperRating(priorite){
  const n = priorite==='High' ? 3 : priorite==='Medium' ? 2 : priorite==='Low' ? 1 : 0;
  const span = document.createElement('span'); span.className='peppers'; span.title = priorite||'Non défini';
  let html='';
  for(let i=0;i<3;i++) html += pepperSvg(i<n);
  span.innerHTML = html;
  return span;
}

/* ---------------- API layer (Google Apps Script) ---------------- */
function getApiUrl(){
  try{ return DEFAULT_API_URL || localStorage.getItem('granda_api_url') || ''; }
  catch(e){ return DEFAULT_API_URL; }
}
function setSync(status, label){
  const dot = document.getElementById('syncDot');
  dot.className = 'syncdot' + (status==='syncing' ? ' syncing' : status==='error' ? ' err' : '');
  document.getElementById('syncLabel').textContent = label;
}
async function apiCall(method, params, body){
  const url = getApiUrl();
  if(!url) throw new Error('no_api_url');
  const q = Object.keys(params||{}).map(k=>encodeURIComponent(k)+'='+encodeURIComponent(params[k])).join('&');
  const full = url + (q ? ('?'+q) : '');
  const opts = { method: method };
  if(body){ opts.headers = {'Content-Type':'text/plain;charset=utf-8'}; opts.body = JSON.stringify(body); }
  const res = await fetch(full, opts);
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'api_error');
  return json.data;
}
function apiList(collection){ return apiCall('GET', {action:'list', collection: collection}); }
function apiCreate(collection, data){ return apiCall('POST', {}, {action:'create', collection: collection, data: data}); }
function apiUpdate(collection, id, data){ return apiCall('POST', {}, {action:'update', collection: collection, id: id, data: data}); }
function apiDelete(collection, id){ return apiCall('POST', {}, {action:'delete', collection: collection, id: id}); }

/* ---------------- state ---------------- */
const state = {
  companies: [], contacts: [], customers: [], goals: [], tournees: [],
  activeView: 'dashboard',
  companyFilters: { search:'', persona:'', owner:'', priorite:'', objectif:'', canal:'', ville:'', statut:'' },
  contactsSearch: '', b2cSearch: '',
  tourneeFilters: { search:'', ville:'' },
  entreprisesViewMode: 'liste',
  ready: false,
};
let tourneeSelected = new Set();
try{ tourneeSelected = new Set(JSON.parse(localStorage.getItem('granda_tournee_selection')||'[]')); }catch(e){}
function saveTourneeSelection(){ try{ localStorage.setItem('granda_tournee_selection', JSON.stringify(Array.from(tourneeSelected))); }catch(e){} }

/* ---------------- boot / setup ---------------- */
function showSetupScreen(){
  document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));
  document.getElementById('tabs').classList.add('hidden');
  const box = document.getElementById('setupScreen');
  box.classList.remove('hidden');
  box.innerHTML = '';
  const card = el('div','card setup-screen');
  card.appendChild(el('h2',null,'Connexion au classeur Google Sheets'));
  card.appendChild(el('p',null,'Colle ici l’URL de l’application Web Apps Script (elle se termine par /exec). Une fois enregistrée dans ce navigateur, cet écran ne réapparaît plus ici.'));
  const input = document.createElement('input'); input.type='url'; input.placeholder='https://script.google.com/macros/s/.../exec';
  const f = el('div','field'); f.appendChild(el('label',null,'URL de l’application Web')); f.appendChild(input);
  card.appendChild(f);
  const btn = el('button','btn btn-primary','Enregistrer et continuer');
  btn.addEventListener('click', ()=>{
    const v = input.value.trim();
    if(!v){ toast('Colle une URL valide'); return; }
    try{ localStorage.setItem('granda_api_url', v); }catch(e){}
    location.reload();
  });
  card.appendChild(btn);
  box.appendChild(card);
}

async function boot(){
  if(!getApiUrl()){ showSetupScreen(); return; }
  document.getElementById('tabs').classList.remove('hidden');
  await refreshAll();
  startPolling();
}
async function refreshAll(){
  setSync('syncing', 'Synchronisation…');
  try{
    const [companies, contacts, customers, goals, tournees] = await Promise.all([
      apiList('Entreprises'), apiList('Contacts'), apiList('Clients_B2C'), apiList('Objectifs'),
      apiList('Tournees').catch(()=>[]), // tant que l'Apps Script n'a pas été redéployé avec l'onglet Tournees
    ]);
    state.companies = companies; state.contacts = contacts; state.customers = customers; state.goals = goals; state.tournees = tournees;
    state.ready = true;
    setSync('ok', 'À jour');
    renderCurrentView();
  }catch(e){
    setSync('error', 'Hors ligne');
  }
}
let pollTimer = null;
function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(refreshAll, 20000);
}

/* ---------------- CRUD helpers ---------------- */
async function createDoc(collection, data){
  setSync('syncing','Enregistrement…');
  try{ const r = await apiCreate(collection, data); await refreshAll(); return r.id; }
  catch(e){ setSync('error','Erreur'); toast('Impossible d’enregistrer'); throw e; }
}
async function updateDoc(collection, id, patch){
  setSync('syncing','Enregistrement…');
  try{ await apiUpdate(collection, id, patch); await refreshAll(); }
  catch(e){ setSync('error','Erreur'); toast('Impossible d’enregistrer'); throw e; }
}
async function deleteDoc(collection, id){
  setSync('syncing','Suppression…');
  try{ await apiDelete(collection, id); await refreshAll(); }
  catch(e){ setSync('error','Erreur'); toast('Impossible de supprimer'); throw e; }
}

/* ---------------- router ---------------- */
function renderCurrentView(){
  if(!state.ready) return;
  if(state.activeView==='dashboard') renderDashboard();
  else if(state.activeView==='objectifs') renderGoals();
  else if(state.activeView==='pipeline') renderPipeline();
  else if(state.activeView==='tournee') renderTournee();
  else if(state.activeView==='entreprises') renderEntreprises();
  else if(state.activeView==='contacts') renderContacts();
  else if(state.activeView==='b2c') renderB2C();
}
document.getElementById('tabs').addEventListener('click', e=>{
  const btn = e.target.closest('.tab'); if(!btn) return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  state.activeView = btn.dataset.view;
  document.getElementById('view-'+state.activeView).classList.add('active');
  renderCurrentView();
});
document.addEventListener('click', e=>{
  if(!e.target.closest('.filter-wrap')){ document.querySelectorAll('.filter-panel').forEach(p=>p.classList.add('hidden')); }
});

/* ---------------- filter toolbar ---------------- */
function buildViewToggle(options, current, onChange){
  const toggle = el('div','view-toggle');
  options.forEach(o=>{
    const btn = el('button', current===o.value?'active':'', o.label);
    btn.addEventListener('click', ()=> onChange(o.value));
    toggle.appendChild(btn);
  });
  return toggle;
}
function buildSearchToggle(value, placeholder, onInput){
  const wrap = el('div','search-toggle');
  const icon = '<svg viewBox="0 0 20 20" width="15" height="15"><circle cx="8.3" cy="8.3" r="5.8" fill="none" stroke="currentColor" stroke-width="2"/><line x1="12.7" y1="12.7" x2="17.5" y2="17.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  const btn = el('button','btn search-icon-btn'); btn.innerHTML = icon; btn.title = 'Rechercher';
  const input = document.createElement('input'); input.type='search'; input.className='btn search-input-big'; input.placeholder=placeholder; input.value=value;
  function showInput(){ wrap.innerHTML=''; wrap.appendChild(input); input.focus(); }
  function showBtn(){ wrap.innerHTML=''; wrap.appendChild(btn); }
  btn.addEventListener('click', showInput);
  input.addEventListener('input', e=> onInput(e.target.value));
  input.addEventListener('blur', ()=>{ if(!input.value) showBtn(); });
  input.addEventListener('keydown', e=>{ if(e.key==='Escape'){ input.value=''; onInput(''); showBtn(); } });
  if(value) wrap.appendChild(input); else wrap.appendChild(btn);
  return {wrap, focusInput: showInput};
}
function renderCompanyFilterToolbar(container, opts){
  container.innerHTML='';
  const triggerCompanySearch = debounce(()=>{
    renderCurrentView();
    const freshInput = container.querySelector('input[type=search]');
    if(freshInput){ freshInput.focus(); const v=freshInput.value; freshInput.setSelectionRange(v.length, v.length); }
  }, 300);
  const searchToggle = buildSearchToggle(state.companyFilters.search, 'Rechercher une entreprise…', v=>{ state.companyFilters.search=v; triggerCompanySearch(); });
  container.appendChild(searchToggle.wrap);
  container.appendChild(el('div','spacer'));
  function mkSelect(key, values, label){
    const s = document.createElement('select');
    const opt0 = el('option', null, label); opt0.value=''; s.appendChild(opt0);
    values.forEach(v=>{ const o=el('option',null,v); o.value=v; if(state.companyFilters[key]===v) o.selected=true; s.appendChild(o); });
    s.addEventListener('change', e=>{ state.companyFilters[key]=e.target.value; renderCurrentView(); });
    return s;
  }
  function mkSelectKV(key, pairs, label){
    const s = document.createElement('select');
    const opt0 = el('option', null, label); opt0.value=''; s.appendChild(opt0);
    pairs.forEach(p=>{ const o=el('option',null,p.label); o.value=p.value; if(state.companyFilters[key]===p.value) o.selected=true; s.appendChild(o); });
    s.addEventListener('change', e=>{ state.companyFilters[key]=e.target.value; renderCurrentView(); });
    return s;
  }
  const activeCount = ['persona','owner','priorite','objectif','canal','ville','statut'].filter(k=>state.companyFilters[k]).length;
  const filterWrap = el('div','filter-wrap');
  const filterBtn = el('button','btn filter-btn');
  filterBtn.appendChild(document.createTextNode('Filtres'));
  if(activeCount>0) filterBtn.appendChild(el('span','filter-count', String(activeCount)));
  const panel = el('div','filter-panel hidden');
  panel.appendChild(mkSelectKV('statut', Object.keys(MAP_STATUS_META).map(k=>({value:k,label:MAP_STATUS_META[k].label})), 'Tous statuts'));
  panel.appendChild(mkSelect('persona', D.personas, 'Toutes personas'));
  panel.appendChild(mkSelect('canal', D.canaux, 'Tous canaux'));
  const villes = Array.from(new Set(state.companies.map(c=>c.ville_pays).filter(Boolean))).sort((a,b)=>a.localeCompare(b));
  panel.appendChild(mkSelect('ville', villes, 'Toutes villes'));
  panel.appendChild(mkSelect('owner', D.owners, 'Tous owners'));
  panel.appendChild(mkSelect('priorite', D.priorites, 'Toutes priorités'));
  panel.appendChild(mkSelect('objectif', D.objectifs, 'Tous objectifs'));
  filterBtn.addEventListener('click', e=>{
    e.stopPropagation();
    const willOpen = panel.classList.contains('hidden');
    document.querySelectorAll('.filter-panel').forEach(p=>p.classList.add('hidden'));
    if(willOpen) panel.classList.remove('hidden');
  });
  panel.addEventListener('click', e=> e.stopPropagation());
  filterWrap.appendChild(filterBtn); filterWrap.appendChild(panel);
  container.appendChild(filterWrap);
  if(opts && opts.viewToggle){
    container.appendChild(buildViewToggle(
      [{value:'liste',label:'Liste'},{value:'carte',label:'Carte'}],
      state.entreprisesViewMode,
      m=>{ state.entreprisesViewMode=m; renderEntreprises(); }
    ));
  }
  if(opts && opts.addButton){
    const btn = el('button','btn btn-primary','+ Nouvelle entreprise');
    btn.addEventListener('click', openAddCompanyModal);
    container.appendChild(btn);
  }
}
function getFilteredCompanies(){
  const f = state.companyFilters;
  return state.companies.filter(l=>{
    if(f.persona && l.persona!==f.persona) return false;
    if(f.priorite && l.priorite!==f.priorite) return false;
    if(f.objectif && l.objectif!==f.objectif) return false;
    if(f.owner && !ownersList(l.owners).includes(f.owner)) return false;
    if(f.canal && l.canal!==f.canal) return false;
    if(f.ville && l.ville_pays!==f.ville) return false;
    if(f.statut && computeMapStatus(l)!==f.statut) return false;
    if(f.search){
      const s = f.search.toLowerCase();
      const hay = [l.nom,l.instagram,l.localisation,l.ville_pays,l.detail].join(' ').toLowerCase();
      if(!hay.includes(s)) return false;
    }
    return true;
  });
}

/* ---------------- DASHBOARD ---------------- */
function renderDashboard(){
  const companies = state.companies;
  const active = companies.filter(l=>l.stage!==KO);
  const kpi = document.getElementById('kpiGrid'); kpi.innerHTML='';
  function addKpi(num, lbl, hero){
    const c = el('div','card kpi'+(hero?' hero':''));
    c.appendChild(el('div','num',num)); c.appendChild(el('div','lbl',lbl));
    kpi.appendChild(c);
  }
  const totalValeur = active.reduce((s,l)=>s+(Number(l.valeur)||0),0);
  const today = todayISO();
  const overdue = active.filter(l=>{ const d=parseISODate(l.date_prochaine_action); return d && l.date_prochaine_action < today; }).length;
  addKpi(String(active.length), 'Entreprises actives');

function goalCard(g, compact){
  const card = el('div', compact ? '' : 'card goal-card');
  if(compact) card.style.marginBottom='14px';
  const head = el('div','head');
  head.appendChild(el('span','title', g.titre || '(sans titre)'));
  head.appendChild(el('span','nums', (g.valeur_actuelle||0)+' / '+(g.cible||0)+' '+(g.unite||'')));
  card.appendChild(head);
  const track = el('div','goal-track');
  const pct = g.cible ? Math.min(100, Math.round((Number(g.valeur_actuelle)||0)/Number(g.cible)*100)) : 0;
  const fill = el('div','goal-fill'); fill.style.width = pct+'%';
  if(pct>=100) fill.style.background='var(--success)';
  else if(pct<34) fill.style.background='var(--primary)';
  else fill.style.background='var(--warn)';
  track.appendChild(fill); card.appendChild(track);
  const meta = el('div','goal-meta');
  meta.appendChild(el('span',null, g.echeance ? ('Échéance : '+fmtDateDisplay(g.echeance)) : ''));
  meta.appendChild(el('span',null, pct+'%'));
  card.appendChild(meta);
  if(!compact){
    card.style.cursor='pointer';
    card.addEventListener('click', ()=>openGoalModal(g));
  }
  return card;
}
function renderGoals(){
  const list = document.getElementById('goalsList'); list.innerHTML='';

  const listBox = el('div'); listBox.style.marginTop='14px';

    await updateDoc('Tournees', t.id, {stops: JSON.stringify(stops), statut});
    t.stops = JSON.stringify(stops); t.statut = statut;
  }

  function renderStops(){
    listBox.innerHTML = '';
    stops.forEach((s, idx)=>{
      const c = state.companies.find(x=>x.id===s.entreprise_id);
      const row = el('div','tournee-stop');

      const reorder = el('div','tournee-stop-reorder');
      const upBtn = el('button','btn-ghost-sm','↑'); upBtn.disabled = idx===0;
      upBtn.addEventListener('click', ()=>{ const tmp=stops[idx-1]; stops[idx-1]=stops[idx]; stops[idx]=tmp; stops.forEach((s,i)=>s.ordre=i); renderStops(); persistStops().catch(()=>{}); });
      const downBtn = el('button','btn-ghost-sm','↓'); downBtn.disabled = idx===stops.length-1;
      downBtn.addEventListener('click', ()=>{ const tmp=stops[idx+1]; stops[idx+1]=stops[idx]; stops[idx]=tmp; stops.forEach((s,i)=>s.ordre=i); renderStops(); persistStops().catch(()=>{}); });
      reorder.appendChild(upBtn); reorder.appendChild(downBtn);
      top.appendChild(reorder);
      const info = el('div','tournee-stop-info');
      info.appendChild(el('div','nom', c ? (c.nom||'(sans nom)') : '(entreprise supprimée)'));
      if(c) info.appendChild(el('div','muted', mapsLink(c)));
      top.appendChild(info);
      const statusBadge = el('span','stage-chip', s.statut==='realisee' ? 'Réalisée' : 'À faire');
      if(s.statut==='realisee'){ statusBadge.style.background='var(--phase-actif-bg)'; statusBadge.style.color='var(--phase-actif-fg)'; }
      else { statusBadge.style.background='var(--phase-perdu-bg)'; statusBadge.style.color='var(--phase-perdu-fg)'; }
      top.appendChild(statusBadge);
      row.appendChild(top);

      const actions = el('div','tournee-stop-actions');
      if(c){
        const navBtn = el('a','btn btn-sm','Google Maps');
        navBtn.href = 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(mapsLink(c));
        navBtn.target = '_blank';
        actions.appendChild(navBtn);
        const appleBtn = el('a','btn btn-sm','Apple Plans');
        appleBtn.href = 'https://maps.apple.com/?daddr='+encodeURIComponent(mapsLink(c));
        appleBtn.target = '_blank';
        actions.appendChild(appleBtn);
        const openFicheBtn = el('button','btn btn-sm','Ouvrir la fiche');
        openFicheBtn.addEventListener('click', ()=> openCompanyDetail(c.id));
        actions.appendChild(openFicheBtn);
      }
      if(s.statut!=='realisee'){
        const doneBtn = el('button','btn btn-sm btn-primary','Marquer réalisée');
        doneBtn.addEventListener('click', ()=>{
          row.appendChild(buildCompteRenduForm(s, c));
          doneBtn.disabled = true;
        });
        actions.appendChild(doneBtn);
      }
      row.appendChild(actions);
      if(s.statut==='realisee' && s.compte_rendu){
        row.appendChild(el('div','feed-text', 'Compte-rendu : '+s.compte_rendu));
      }
      listBox.appendChild(row);
    });
  }
  function buildCompteRenduForm(s, c){

          const next = parseLog(c.notes_log).concat([{date:new Date().toISOString(), auteur:t.owner, texte: s.compte_rendu || 'Visite réalisée.', type:'Visite'}]);

    form.appendChild(ta); form.appendChild(btn);
    return form;

const mapIcons = {};
function mapIcon(statusKey){
  if(mapIcons[statusKey]) return mapIcons[statusKey];
  const color = MAP_STATUS_META[statusKey] ? MAP_STATUS_META[statusKey].color : 'var(--text-muted)';
  const icon = L.divIcon({
    className: 'map-pin-wrap',
    html: '<div class="map-pin" style="background:'+color+';"></div>',
    iconSize: [22,22], iconAnchor: [11,22], popupAnchor: [0,-20]
  });
  mapIcons[statusKey] = icon;
  return icon;
}
function lastInteractionDate(c){
  const notes = parseLog(c.notes_log).map(n=>n.date).filter(Boolean);
  const commandes = parseLog(c.commandes_log).map(o=>o.date).filter(Boolean);
  const all = notes.concat(commandes).sort();

async function renderEntreprisesMap(allCompanies){
  const statusEl = document.getElementById('entreprisesMapStatus');
  renderMapLegend();
  renderMapSelectionBar();
  const companies = allCompanies.filter(c=>c.stage!==KO);
  if(!leafletMap){
    leafletMap = L.map('entreprisesMap').setView([43.66, -1.42], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19
    }).addTo(leafletMap);
    leafletMarkersLayer = L.layerGroup().addTo(leafletMap);
  } else {
    leafletMap.invalidateSize();
  }
  leafletMarkersLayer.clearLayers();

  const withAddress = companies.filter(c=>c.localisation);
  const withoutAddress = companies.length - withAddress.length;
  const geocoded = withAddress.filter(c=>c.geo_lat && c.geo_lng);
  const toGeocode = withAddress.filter(c=>!(c.geo_lat && c.geo_lng));

  function plot(c){
    const statusKey = computeMapStatus(c);
    const marker = L.marker([Number(c.geo_lat), Number(c.geo_lng)], {icon: mapIcon(statusKey)});
    const popup = document.createElement('div'); popup.className='map-popup';
    popup.appendChild(el('div','nom', c.nom||'(sans nom)'));
    popup.appendChild(el('div','muted', [c.persona, c.stage].filter(Boolean).join(' · ')));
    const badge = el('span','statut-badge', MAP_STATUS_META[statusKey].label);
    badge.style.background = MAP_STATUS_META[statusKey].color;
    popup.appendChild(badge);
    const lastDate = lastInteractionDate(c);
    const meta = el('div','map-meta');
    meta.textContent = (lastDate ? 'Dernière interaction : '+fmtDateDisplay(lastDate) : 'Aucune interaction enregistrée') +
      (c.date_prochaine_action ? ' · Prochaine action : '+fmtDateDisplay(c.date_prochaine_action) : '');
    popup.appendChild(meta);
    const lbl = document.createElement('label');
    const cb = document.createElement('input'); cb.type='checkbox'; cb.checked = tourneeSelected.has(c.id);
    cb.addEventListener('change', ()=>{ if(cb.checked) tourneeSelected.add(c.id); else tourneeSelected.delete(c.id); saveTourneeSelection(); renderMapSelectionBar(); });
    lbl.appendChild(cb); lbl.appendChild(document.createTextNode('Ajouter à la tournée'));
    popup.appendChild(lbl);
    const btn = el('button','btn btn-sm','Ouvrir la fiche');
    btn.addEventListener('click', ()=> openCompanyDetail(c.id));
    popup.appendChild(btn);
    marker.bindPopup(popup);
    marker.addTo(leafletMarkersLayer);
  }
  geocoded.forEach(plot);

  const baseStatus = withoutAddress>0 ? (withoutAddress+' établissement(s) sans adresse ne sont pas affichés (ajoutez-la dans l’onglet Infos).') : '';
  statusEl.textContent = baseStatus;

  if(toGeocode.length>0 && !geocodingInProgress){
    geocodingInProgress = true;
    for(const c of toGeocode){
      statusEl.textContent = 'Géocodage des adresses en cours… ('+(toGeocode.indexOf(c)+1)+'/'+toGeocode.length+')';
      try{
        const q = encodeURIComponent(c.localisation+(c.localisation.toLowerCase().includes('france')?'':', France'));
        const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+q, {headers:{'Accept-Language':'fr'}});
        const data = await res.json();
        if(data && data[0]){
          const lat = data[0].lat, lng = data[0].lon;
          await updateDoc('Entreprises', c.id, {geo_lat: lat, geo_lng: lng});
          c.geo_lat = lat; c.geo_lng = lng;
          plot(c);
        }
      }catch(e){ /* adresse non trouvée (géocodage impossible) : on passe à la suivante, jamais d'invention de position */ }
      await new Promise(r=>setTimeout(r, 1100));
    }
    geocodingInProgress = false;
    statusEl.textContent = baseStatus;
  }
}

function buildDrawerTabs(drawer, tabs){
  const bar = el('div','drawer-tabs');
  const panels = {};
  const buttons = {};
  tabs.forEach((t,i)=>{
    const btn = el('button','drawer-tab'+(i===0?' active':''), t.label);
    btn.addEventListener('click', ()=>{
      Object.keys(buttons).forEach(k=> buttons[k].classList.toggle('active', k===t.id));
      Object.keys(panels).forEach(k=> panels[k].classList.toggle('active', k===t.id));
    });
    buttons[t.id] = btn;
    bar.appendChild(btn);
  });
  drawer.appendChild(bar);
  return {
    registerPanel:(id, node)=>{
      node.classList.add('drawer-panel');
      if(id===tabs[0].id) node.classList.add('active');
      panels[id] = node;
      drawer.appendChild(node);

  list.forEach(c=>{
    const tr = el('tr','leadrow'); tr.addEventListener('click', ()=>openContactModal(c));
    tr.appendChild(el('td',null, c.nom || '(sans nom)'));
    tr.appendChild(el('td',null, companyName(c.entreprise_id) || '—'));
    tr.appendChild(el('td',null, c.role || ''));
    tr.appendChild(el('td',null, c.email || ''));
    tr.appendChild(el('td',null, c.telephone || ''));
    tbody.appendChild(tr);
  });
}
document.getElementById('contactsSearch').addEventListener('input', e=>{ state.contactsSearch=e.target.value; renderContacts(); });
document.getElementById('addContactBtn').addEventListener('click', ()=>openContactModal(null));
function openContactModal(contact, presetCompanyId){
  const root = document.getElementById('modalRoot'); root.innerHTML='';
  const overlay = el('div','overlay');
  const drawer = el('div','drawer');
  const head = el('div','drawer-head');
  head.appendChild(el('h2',null, contact ? (contact.nom||'(sans nom)') : 'Nouveau contact'));
  addDrawerExpandToggle(head, drawer);
  drawer.appendChild(head);

  const tabsApi = buildDrawerTabs(drawer, [
    {id:'infos', label:'Infos'}, {id:'commandes', label:'Commandes'}, {id:'notes', label:'Notes'}
  ]);
  const panelInfos = el('div');
  const panelCommandes = el('div');
  const panelNotes = el('div');
  tabsApi.registerPanel('infos', panelInfos);
  tabsApi.registerPanel('commandes', panelCommandes);
  tabsApi.registerPanel('notes', panelNotes);

  const fields = {};
  function field(key, labelText, type, val){
    const f = el('div','field'); f.appendChild(el('label',null,labelText));
    const input = type==='textarea' ? document.createElement('textarea') : document.createElement('input');
    if(type!=='textarea') input.type = type || 'text';
    input.value = val || ''; f.appendChild(input); panelInfos.appendChild(f); fields[key]=input; return input;
  }
  field('nom','Nom', 'text', contact && contact.nom);
  const compSel = document.createElement('select');
  const blank = el('option',null,'— Aucune entreprise —'); blank.value=''; compSel.appendChild(blank);
  state.companies.slice().sort((a,b)=>(a.nom||'').localeCompare(b.nom||'')).forEach(c=>{
    const o = el('option',null,c.nom||'(sans nom)'); o.value=c.id;
    if((contact && contact.entreprise_id===c.id) || (!contact && presetCompanyId===c.id)) o.selected=true;
    compSel.appendChild(o);
  });
  const fComp = el('div','field'); fComp.appendChild(el('label',null,'Entreprise liée')); fComp.appendChild(compSel); panelInfos.appendChild(fComp);
  field('role','Rôle / fonction', 'text', contact && contact.role);
  field('email','Email', 'email', contact && contact.email);
  field('telephone','Téléphone', 'tel', contact && contact.telephone);

  const company = contact ? state.companies.find(c=>c.id===contact.entreprise_id) : null;
  panelCommandes.appendChild(el('div','section-title drawer-panel-label','Commandes'));
  const commandesBox = el('div'); panelCommandes.appendChild(commandesBox);
  renderCommandesList(commandesBox, {
    commandes: company ? parseLog(company.commandes_log) : [],
    legacyCommande: company ? company.commandes : ''
  });
  if(!company) commandesBox.appendChild(el('div','muted','Aucune entreprise liée.'));

  panelNotes.appendChild(el('div','section-title drawer-panel-label','Notes'));
  const notesBox = el('div'); panelNotes.appendChild(notesBox);
  if(contact){
    let currentNotes = parseLog(contact.notes_log);
    function renderContactNotes(){
      renderNotesFeed(notesBox, {
        notes: currentNotes,
        legacyNote: contact.notes,
        onAddNote: async (texte, auteur, type)=>{
          const next = currentNotes.concat([{date:new Date().toISOString(), auteur, texte, type}]);
          await updateDoc('Contacts', contact.id, {notes_log: JSON.stringify(next)});
          currentNotes = next; renderContactNotes(); toast('Note ajoutée');
        }
      });
    }
    renderContactNotes();
  } else {
    notesBox.appendChild(el('div','muted','Vous pourrez ajouter des notes une fois le contact créé.'));
  }

  const actions = el('div','drawer-footer');
  if(contact){
    const del = el('button','btn btn-danger','Supprimer');
    del.addEventListener('click', async ()=>{ if(confirm('Supprimer ce contact ?')){ await deleteDoc('Contacts', contact.id); closeModal(); toast('Contact supprimé'); } });
    actions.appendChild(del);
  } else actions.appendChild(el('div'));
  const save = el('button','btn btn-primary', contact ? 'Enregistrer' : 'Créer');
  save.addEventListener('click', async ()=>{
    const data = { nom: fields.nom.value.trim(), entreprise_id: compSel.value || '', role: fields.role.value, email: fields.email.value, telephone: fields.telephone.value };
    if(!data.nom){ toast('Le nom est requis'); return; }
    if(contact){ await updateDoc('Contacts', contact.id, data); closeModal(); toast('Contact mis à jour'); }
    else{ const newId = await createDoc('Contacts', data); closeModal(); toast('Contact créé'); const created = state.contacts.find(c=>c.id===newId); if(created) openContactModal(created); }
  });
  actions.appendChild(save);
  drawer.appendChild(actions);
  overlay.appendChild(drawer);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
  root.appendChild(overlay);
}

/* ---------------- B2C ---------------- */
function renderB2C(){
  document.getElementById('b2cSearch').value = state.b2cSearch;
  const tbody = document.getElementById('b2cTbody'); tbody.innerHTML='';
  const s = state.b2cSearch.toLowerCase();
  const list = state.customers.filter(c=> !s || [c.nom,c.email,c.ville].join(' ').toLowerCase().includes(s))
    .sort((a,b)=>(a.nom||'').localeCompare(b.nom||''));
  if(list.length===0){ const tr=document.createElement('tr'); const td=document.createElement('td'); td.colSpan=6; td.className='empty'; td.textContent='Aucun client B2C pour le moment.'; tr.appendChild(td); tbody.appendChild(tr); return; }
  list.forEach(c=>{
    const tr = el('tr','leadrow'); tr.addEventListener('click', ()=>openB2CModal(c));
    tr.appendChild(el('td',null, c.nom || '(sans nom)'));
    tr.appendChild(el('td',null, c.canal || ''));
    tr.appendChild(el('td',null, c.ville || ''));
    tr.appendChild(el('td',null, c.date_derniere_commande ? fmtDateDisplay(c.date_derniere_commande) : '—'));
    tr.appendChild(el('td',null, c.nb_commandes || 0));
    tr.appendChild(el('td',null, fmtMoney(c.valeur_totale||0)));
    tbody.appendChild(tr);
  });
}
document.getElementById('b2cSearch').addEventListener('input', e=>{ state.b2cSearch=e.target.value; renderB2C(); });
document.getElementById('addB2cBtn').addEventListener('click', ()=>openB2CModal(null));
function openB2CModal(customer){
  const root = document.getElementById('modalRoot'); root.innerHTML='';
  const overlay = el('div','overlay');
  const drawer = el('div','drawer');
  const head = el('div','drawer-head');
  head.appendChild(el('h2',null, customer ? (customer.nom||'(sans nom)') : 'Nouveau client'));
  const closeBtn = el('button','close-x','✕'); closeBtn.addEventListener('click', closeModal);
  head.appendChild(closeBtn); drawer.appendChild(head);
  const fields = {};
  function field(key, labelText, type){
    const f = el('div','field'); f.appendChild(el('label',null,labelText));
    const input = type==='textarea' ? document.createElement('textarea') : document.createElement('input');
    if(type!=='textarea') input.type = type || 'text';
    input.value = customer ? (customer[key] || '') : '';
    f.appendChild(input); drawer.appendChild(f); fields[key]=input; return input;
  }
  field('nom','Nom');
  field('email','Email','email');
  field('telephone','Téléphone','tel');
  field('ville','Ville');
  const f = el('div','field'); f.appendChild(el('label',null,'Canal d’acquisition'));
  const sel = document.createElement('select');
  D.canauxB2C.forEach(c=>{ const o=el('option',null,c); o.value=c; if(customer && customer.canal===c) o.selected=true; sel.appendChild(o); });
  f.appendChild(sel); drawer.appendChild(f); fields.canal=sel;
  const dateRow = el('div','field-row');
  const d1 = document.createElement('div'); d1.appendChild(el('label',null,'1ère commande')); const i1=document.createElement('input'); i1.type='date'; i1.value = customer && parseISODate(customer.date_premiere_commande) ? customer.date_premiere_commande : ''; d1.appendChild(i1);
  const d2 = document.createElement('div'); d2.appendChild(el('label',null,'Dernière commande')); const i2=document.createElement('input'); i2.type='date'; i2.value = customer && parseISODate(customer.date_derniere_commande) ? customer.date_derniere_commande : ''; d2.appendChild(i2);
  dateRow.appendChild(d1); dateRow.appendChild(d2); drawer.appendChild(dateRow);
  fields.date_premiere_commande=i1; fields.date_derniere_commande=i2;
  const numRow = el('div','field-row');
  const n1 = document.createElement('div'); n1.appendChild(el('label',null,'Nb commandes')); const ni1=document.createElement('input'); ni1.type='number'; ni1.value = customer ? (customer.nb_commandes||0) : 0; n1.appendChild(ni1);
  const n2 = document.createElement('div'); n2.appendChild(el('label',null,'Valeur totale (€)')); const ni2=document.createElement('input'); ni2.type='number'; ni2.value = customer ? (customer.valeur_totale||0) : 0; n2.appendChild(ni2);
  numRow.appendChild(n1); numRow.appendChild(n2); drawer.appendChild(numRow);
  fields.nb_commandes=ni1; fields.valeur_totale=ni2;
  const cb = el('label','checkbox-row'); const cbi=document.createElement('input'); cbi.type='checkbox'; cbi.checked = customer ? (customer.newsletter===true || customer.newsletter==='TRUE' || customer.newsletter==='true') : false;
  cb.appendChild(cbi); cb.appendChild(document.createTextNode('Inscrit à la newsletter')); drawer.appendChild(cb); fields.newsletter=cbi;
  field('notes','Notes','textarea');
  const footer = el('div','drawer-footer');
  if(customer){
    const del = el('button','btn btn-danger','Supprimer');
    del.addEventListener('click', async ()=>{ if(confirm('Supprimer ce client ?')){ await deleteDoc('Clients_B2C', customer.id); closeModal(); toast('Client supprimé'); } });
    footer.appendChild(del);
  } else footer.appendChild(el('div'));
  const save = el('button','btn btn-primary', customer ? 'Enregistrer' : 'Créer');
  save.addEventListener('click', async ()=>{
    const data = {
      nom: fields.nom.value.trim(), email: fields.email.value, telephone: fields.telephone.value, ville: fields.ville.value,
      canal: fields.canal.value, date_premiere_commande: fields.date_premiere_commande.value, date_derniere_commande: fields.date_derniere_commande.value,
      nb_commandes: Number(fields.nb_commandes.value)||0, valeur_totale: Number(fields.valeur_totale.value)||0,
      newsletter: fields.newsletter.checked, notes: fields.notes.value,
    };
    if(!data.nom){ toast('Le nom est requis'); return; }
    if(customer) await updateDoc('Clients_B2C', customer.id, data); else await createDoc('Clients_B2C', data);
    closeModal(); toast(customer ? 'Client mis à jour' : 'Client créé');
  });
  footer.appendChild(save);
  drawer.appendChild(footer);
  overlay.appendChild(drawer);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
  root.appendChild(overlay);
}

/* ---------------- boot ---------------- */
boot();
})();
</script>
